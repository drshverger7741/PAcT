<!DOCTYPE html>
<html lang="{{ language or 'ru' }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ i18n.title }}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    <!-- Pico.css Local -->
    <link rel="stylesheet" href="/static/pico.min.css">
    <!-- HTMX Local -->
    <script src="/static/htmx.min.js"></script>
    <style>
        :root {
            --primary: #1095c1;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .state-indicator {
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        nav li {
            list-style: none;
        }
        details summary {
            cursor: pointer;
            padding: 12px 15px;
            background: #2d3138;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
            position: relative;
            padding-left: 40px;
            min-height: 50px;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        details summary {
            list-style: none;
        }
        details summary::after {
            display: none;
        }
        details summary::before {
            content: '▶';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.2s;
            font-size: 0.8em;
            color: #aaa;
        }
        details[open] > summary::before {
            transform: translateY(-50%) rotate(90deg);
        }
        details summary > * {
            pointer-events: auto;
        }
        details summary:hover {
            background: #363b45;
        }
        details[open] > summary {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            margin-bottom: 0;
            background: #363b45;
        }
        details details summary {
            background: #3a3f4b;
            margin-left: 20px;
            border-radius: 6px;
        }
        details details[open] > summary {
            background: #444a57;
        }
        .summary-stats {
            font-size: 0.85em;
            color: #aaa;
            margin-left: 10px;
        }
        .week-summary, .day-summary {
            background: #262930 !important;
            padding: 8px 15px 8px 35px !important;
            font-weight: bold;
            font-size: 0.9em;
            color: #1095c1;
            border-left: 4px solid #1095c1;
            margin: 5px 0 5px 20px !important;
            border-radius: 0 4px 4px 0 !important;
            min-height: 50px;
        }
        .week-summary::before, .day-summary::before {
            left: 10px !important;
        }
        details[open] > .week-summary, details[open] > .day-summary {
            margin-bottom: 0 !important;
        }
        .day-row {
            margin-left: 20px;
            padding: 2px 0;
        }
        .day-row > details {
            border: none;
            overflow: visible;
            margin-bottom: 5px;
        }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #555;
            font-style: italic;
        }
        [contenteditable]:focus {
            outline: 2px solid #1095c1;
            background: #252a33 !important;
        }
        table[role="grid"] {
            margin-bottom: 0;
            font-size: 0.9em;
        }
        table[role="grid"] th, table[role="grid"] td {
            padding: 8px 12px;
        }
        .state-active { color: #4caf50; }
        .state-idle { color: #ffeb3b; }
        .state-locked, .state-sleep, .state-no_session { color: #f44336; }
        
        /* Modal Styles */
        dialog article {
            max-width: 500px;
            width: 100%;
        }
        .comment-text {
            cursor: pointer;
            border-bottom: 1px dashed #666;
            display: inline-block;
            min-height: 1.5em;
            min-width: 120px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 4px;
            vertical-align: middle;
            position: relative;
            font-size: 0.9em;
            transition: background 0.2s, border-color 0.2s;
        }
        .comment-text:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
        }
        .comment-text:empty::after, .comment-text:blank::after {
            content: "📝 {{ i18n.add_dot }}";
            opacity: 0.5;
            font-size: 0.85em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>{{ i18n.title }}</strong></li>
            </ul>
            <ul>
                <li><a href="/settings" class="secondary">{{ i18n.settings }}</a></li>
                <li id="current-state-container" class="state-indicator" hx-get="/api/state" hx-trigger="load, every 5s" hx-swap="innerHTML">
                    {{ i18n.loading_details }}
                </li>
            </ul>
        </nav>

        <section id="stats-section">
            <div id="stats-container" hx-get="/api/stats" hx-trigger="every 60s" hx-swap="innerHTML">
                {% include 'stats_rows.html' %}
            </div>
        </section>
    </main>

    <!-- Modal for Comments -->
    <dialog id="comment-modal">
        <article>
            <header>
                <a href="#close" aria-label="Close" class="close" onclick="closeModal()"></a>
                <h3 id="modal-title">{{ i18n.comment }}</h3>
            </header>
            <form id="comment-form" hx-post="" hx-target="" hx-on::after-request="closeModal()">
                <p id="modal-description"></p>
                <textarea name="comment" id="modal-comment-text" placeholder="{{ i18n.comment }}..."></textarea>
                <footer>
                    <button type="button" class="secondary" onclick="closeModal()">{{ i18n.cancel }}</button>
                    <button type="submit">{{ i18n.save_changes }}</button>
                </footer>
            </form>
        </article>
    </dialog>

    <script>
        function openModal(title, description, targetUrl, targetId, currentComment) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-description').innerText = description;
            document.getElementById('modal-comment-text').value = currentComment || '';
            
            const form = document.getElementById('comment-form');
            form.setAttribute('hx-post', targetUrl);
            form.setAttribute('hx-target', '#' + targetId);
            
            // Re-process the form with HTMX to update attributes
            htmx.process(form);
            
            document.getElementById('comment-modal').setAttribute('open', 'true');
        }

        function closeModal() {
            document.getElementById('comment-modal').removeAttribute('open');
        }
        
        // Close modal on Esc key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
