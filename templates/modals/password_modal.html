<!-- Modal for Password Set/Change -->
<dialog id="password-modal">
    <article style="padding: 30px;">
        <div class="modal-header-accent" style="margin: -30px -30px 15px -30px;">
            <h3 id="password-modal-title">🔐 {{ i18n.password }}</h3>
            <a href="#close" aria-label="Close" class="close" onclick="closePasswordModal()"></a>
        </div>
        <form id="password-form" hx-post="/api/settings/password" hx-target="#password-error" hx-swap="innerHTML">
            <div id="password-error" style="color: var(--del-color); margin-bottom: 10px; font-size: 0.9rem;"></div>
            
            <label for="new_password">{{ i18n.password }}</label>
            <input type="password" name="new_password" id="new_password" required>
            
            <label for="confirm_password">{{ i18n.confirm_password }}</label>
            <input type="password" name="confirm_password" id="confirm_password" required>
            
            <footer style="margin-top: 10px; text-align: right; background: transparent; border-top: none; padding: 0;">
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="submit" class="btn-compact" style="background: var(--primary);">{{ i18n.save_changes }}</button>
                </div>
            </footer>
        </form>
    </article>
</dialog>

<script>
function openPasswordModal(title) {
    document.getElementById('password-modal-title').innerHTML = `🔐 ${title}`;
    document.getElementById('password-error').innerHTML = '';
    document.getElementById('new_password').value = '';
    document.getElementById('confirm_password').value = '';
    document.getElementById('password-modal').setAttribute('open', 'true');
}

function closePasswordModal() {
    document.getElementById('password-modal').removeAttribute('open');
}

// Handle successful password change
document.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.target.id === 'password-error') {
        try {
            const response = JSON.parse(evt.detail.xhr.responseText);
            if (response.status === 'success') {
                closePasswordModal();
                alert('{{ i18n.password_saved }}');
                window.location.reload();
            } else if (response.status === 'error') {
                evt.detail.target.innerHTML = '{{ i18n.passwords_dont_match }}';
            }
        } catch(e) {
            // Not JSON or other error
        }
    }
});
</script>
