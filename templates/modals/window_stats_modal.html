<!-- Modal for Window Stats -->
<dialog id="window-stats-modal">
    <article style="max-width: 95vw; width: 1200px;">
        <div class="modal-header-accent">
            <h3 id="window-stats-title">{{ i18n.window_stats }}</h3>
            <a href="#close" aria-label="Close" class="close" onclick="closeWindowStats()"></a>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('overview')">{{ i18n.tab_overview }}</button>
            <button class="tab-btn" onclick="switchTab('timeline')">{{ i18n.tab_timeline }}</button>
        </div>
        
        <!-- Tab 1: Overview -->
        <div id="tab-overview" class="tab-content active">
            <div class="grid">
                <!-- Chart Column -->
                <div style="min-width: 300px;">
                    <h4 style="text-align: center; margin-bottom: 20px;">{{ i18n.top_apps }}</h4>
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 400px; padding: 10px;">
                        <div style="width: 100%; height: 100%; position: relative;">
                            <canvas id="window-stats-chart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Table Column -->
                <div style="min-width: 300px;">
                    <h4 style="text-align: center; margin-bottom: 20px;">{{ i18n.details }}</h4>
                    <div class="stats-table-container" style="overflow-x: auto;">
                        <table role="grid" style="width: 100%; min-width: 500px;">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">{{ i18n.app }}</th>
                                    <th style="width: 60%;">{{ i18n.window }}</th>
                                    <th style="width: 15%;">{{ i18n.duration }}</th>
                                </tr>
                            </thead>
                            <tbody id="window-stats-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Timeline -->
        <div id="tab-timeline" class="tab-content">
            <div class="filter-bar">
                <input type="text" id="timeline-filter" class="filter-input" placeholder="{{ i18n.filter_placeholder }}" oninput="filterTimeline()">
                <span id="timeline-count" style="font-size: 0.8rem; color: var(--text-muted-more); margin-left: auto;"></span>
            </div>
            <div class="timeline-table-container">
                <table role="grid" class="timeline-table" style="width: 100%;">
                    <thead>
                        <tr>
                            <th style="width: 10%;">{{ i18n.date }}</th>
                            <th style="width: 10%;">{{ i18n.start }}</th>
                            <th style="width: 10%;">{{ i18n.end }}</th>
                            <th style="width: 20%;">{{ i18n.app }}</th>
                            <th style="width: 40%;">{{ i18n.window }}</th>
                            <th style="width: 10%;">{{ i18n.duration }}</th>
                        </tr>
                    </thead>
                    <tbody id="window-timeline-table-body"></tbody>
                </table>
            </div>
        </div>
        
    </article>
</dialog>
