<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAcT</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    <link rel="stylesheet" href="/static/pico.min.css">
    <style>
        :root {
            --primary: #1095c1;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        h3 {
            font-size: 1.25rem;
        }
        label {
            font-size: 0.9rem;
        }
        small {
            font-size: 0.7em;
            color: #888;
        }
        input[type="number"], button {
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>PAct</strong></li>
            </ul>
            <ul>
                <li><a href="/">Статистика</a></li>
                <li><a href="/settings" class="secondary">Настройки</a></li>
            </ul>
        </nav>
        <section>
            <h2 style="border-bottom: 2px solid var(--primary); display: inline-block; padding-right: 20px;">Настройки мониторинга</h2>
            <form action="/settings" method="post">
                <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
                    <label for="idle_threshold">
                        Порог бездействия (сек)
                        <input type="number" id="idle_threshold" name="idle_threshold" value="{{ idle_threshold }}" min="5" required>
                        <small>Режим "Простой" при отсутствии активности</small>
                    </label>

                    <label for="check_interval">
                        Проверка активности (сек)
                        <input type="number" id="check_interval" name="check_interval" value="{{ check_interval }}" min="1" required>
                        <small>Частота опроса системы</small>
                    </label>

                    <label for="flush_interval">
                        Запись в БД (сек)
                        <input type="number" id="flush_interval" name="flush_interval" value="{{ flush_interval }}" min="5" required>
                        <small>Частота сохранения на диск</small>
                    </label>
                </div>

                <fieldset style="background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 2rem;">
                    <legend style="font-weight: bold; color: var(--primary); padding: 0 10px; font-size: 0.9em;">Отображаемые столбцы в статистике</legend>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 5px; font-size: 0.85em;">
                        {% for col_id, col_name in all_columns %}
                        <label style="margin-bottom: 0; display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" name="visible_columns" value="{{ col_id }}" 
                                   {% if col_id in visible_columns %}checked{% endif %} style="margin-bottom: 0;">
                            <span>{{ col_name }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </fieldset>
                
                <div style="text-align: right;">
                    <button type="submit" style="width: auto; padding: 10px 40px;">Сохранить изменения</button>
                </div>
            </form>
        </section>

        <hr style="margin: 3rem 0;">

        <section style="background: rgba(244, 67, 54, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed #f44336;">
            <h3 style="color: #f44336; margin-bottom: 0.5rem;">Управление сервисом</h3>
            <p style="font-size: 0.8em; opacity: 0.8;">Внимание: при выключении сервис перестанет собирать статистику и веб-интерфейс станет недоступен.</p>
            <button id="shutdown-btn" class="outline contrast" style="width: auto; margin-top: 10px; font-size: 0.8em;">Выключить сервис</button>
        </section>

        <script>
            document.getElementById('shutdown-btn').addEventListener('click', function() {
                if (confirm('Вы уверены, что хотите полностью выключить сервис мониторинга?')) {
                    fetch('/api/shutdown', { method: 'POST' })
                        .then(response => {
                            if (response.ok) {
                                document.body.innerHTML = `
                                    <main class="container" style="text-align: center; margin-top: 100px;">
                                        <h1>Сервис выключен</h1>
                                        <p>Все данные сохранены. Теперь вы можете закрыть эту вкладку.</p>
                                    </main>
                                `;
                            } else {
                                alert('Ошибка при попытке выключить сервис.');
                            }
                        })
                        .catch(error => {
                            // Ошибка ожидаема, так как сервер закрывается
                            document.body.innerHTML = `
                                    <main class="container" style="text-align: center; margin-top: 100px;">
                                        <h1>Сервис выключен</h1>
                                        <p>Связь с сервером разорвана. Все данные сохранены.</p>
                                    </main>
                                `;
                        });
                }
            });
        </script>
    </main>
</body>
</html>
